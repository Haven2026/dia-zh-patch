name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate tag and project
        run: |
          test "v$(<VERSION)" = "$GITHUB_REF_NAME"
          ./tests/run-tests.zsh
      - name: Build release archive
        run: ./scripts/package-release.zsh dist
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.zip.sha256 \
            --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "预发布版。完整模式适用构建见 README 与 manifests/index.json。未知但结构兼容的官方构建自动使用核心模式。"
